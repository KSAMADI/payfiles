[package]
name = "core-rust"
version = "0.1.0"
edition = "2021"
description = "Moteur de conversion de fichiers — compilé en WASM pour le navigateur"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Décodeurs: PNG, JPEG (baseline+progressif), GIF. Encodeurs: PNG, JPEG, WebP.
getrandom = { version = "0.2", features = ["js"] } # requis pour rand en wasm32
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "webp",
] }
